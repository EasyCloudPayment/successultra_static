          $ref: '#/components/schemas/PaymentDataUpdate'
        flow:
          $ref: '#/components/schemas/PaymentLinkFlowType'
        additionalInfo:
          type: string
          description: Additional information
        expiredTime:
          type: string
          format: date-time
          description: Expiration time
    ProblemDetail:
      title: ProblemDetail
      description: An RFC 9457 problem detail returned for an unsuccessful HTTP request.
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: URI reference identifying the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP status code for this occurrence of the problem.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this occurrence of the problem.
      additionalProperties: true
    ProductApplicationReportedStatus:
      title: ProductApplicationReportedStatus
      type: string
      description: Application states that may be reported by the selected product provider.
      enum:
      - IN_PROGRESS
      - CUSTOMER_ACTION_REQUIRED
      - APPROVED
      - REJECTED
      - OPENED
      - FAILED
      - CANCELLED
    ProductApplicationStatus:
      title: ProductApplicationStatus
      type: string
      enum:
      - RECEIVED
      - IN_PROGRESS
      - CUSTOMER_ACTION_REQUIRED
      - APPROVED
      - REJECTED
      - OPENED
      - FAILED
      - CANCELLED
    ProductApplicationStatusReport:
      title: ProductApplicationStatusReport
      type: object
      additionalProperties: false
      required:
      - effectiveAt
      - participantStatusReportId
      - providerParticipantCode
      - receivedAt
      - reportId
      - status
      properties:
        reportId:
          type: string
          format: uuid
        participantStatusReportId:
          type: string
          minLength: 1
          maxLength: 255
        providerParticipantCode:
          type: string
          minLength: 1
          maxLength: 64
        providerApplicationId:
          type: string
          minLength: 1
          maxLength: 255
        status:
          $ref: '#/components/schemas/ProductApplicationReportedStatus'
        statusReason:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
        requiredActionCode:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Z][A-Z0-9_]*$
        openedAccountId:
          type: string
          minLength: 1
          maxLength: 255
        effectiveAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
    ProductApplicationStatusReportRequest:
      title: ProductApplicationStatusReportRequest
      type: object
      additionalProperties: false
      required:
      - effectiveAt
      - participantStatusReportId
      - status
      properties:
        participantStatusReportId:
          type: string
          minLength: 1
          maxLength: 255
          description: Business reference assigned by the provider participant.
        providerApplicationId:
          type: string
          minLength: 1
          maxLength: 255
        status:
          $ref: '#/components/schemas/ProductApplicationReportedStatus'
        statusReason:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
        requiredActionCode:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Z][A-Z0-9_]*$
          description: Provider-defined customer action code when status is CUSTOMER_ACTION_REQUIRED.
        openedAccountId:
          type: string
          minLength: 1
          maxLength: 255
          description: Opaque provider account reference supplied when status is OPENED.
        effectiveAt:
          type: string
          format: date-time
      allOf:
      - if:
          properties:
            status:
              const: CUSTOMER_ACTION_REQUIRED
        then:
          properties:
            requiredActionCode: {}
          required:
          - requiredActionCode
      - if:
          properties:
            status:
              const: OPENED
        then:
          properties:
            openedAccountId: {}
          required:
          - openedAccountId
    ProviderResponseOutcome:
      title: ProviderResponseOutcome
      type: string
      enum:
      - AVAILABLE
      - NOT_AVAILABLE
      - DECLINED
      - CLIENT_NOT_FOUND
      - FAILED
    RequestToPayCreateDto:
      type: object
      description: DTO for creating a REQUEST_TO_PAY payment link (flow limited to P2P/C2B/B2B)
      required:
      - flow
      properties:
        debtor:
          $ref: '#/components/schemas/PaymentLinkUserFull'
        creditor:
          $ref: '#/components/schemas/PaymentLinkUserFull'
        paymentData:
          $ref: '#/components/schemas/PaymentLinkPaymentDataFull'
        flow:
          $ref: '#/components/schemas/PaymentLinkFlowType'
        additionalInfo:
          type: string
          description: Additional information
        expiredTime:
          type: string
          format: date-time
          description: Expiration time
    RequestToPayUpdateDto:
      type: object
      description: DTO for updating a REQUEST_TO_PAY payment link (flow limited to P2P/C2B/B2B)
      required:
      - id
      - version
      - flow
      properties:
        id:
          type: string
          description: Payment link identifier
          example: upl-ABCDEFGH
        version:
          type: integer
          description: Version for optimistic locking
          minimum: 0
        debtor:
          $ref: '#/components/schemas/UserUpdate'
        creditor:
          $ref: '#/components/schemas/UserUpdate'
        paymentData:
          $ref: '#/components/schemas/PaymentDataUpdate'
        flow:
          $ref: '#/components/schemas/PaymentLinkFlowType'
        additionalInfo:
          type: string
          description: Additional information
        expiredTime:
          type: string
          format: date-time
          description: Expiration time
    RowsResponseBase:
      title: RowsResponseBase
      type: object
      properties:
        rowCount:
          type: integer
          format: int64
          minimum: 0
        groupLevelInfo:
          type: object
          additionalProperties: true
        pivotResultFields:
          type: array
          items:
            type: string
        grandTotalData:
          type: object
          additionalProperties: true
    SwitchId:
      title: SwitchId
      description: Identifier of a client in the Switch.
      type: object
      additionalProperties: false
      required:
      - value
      - type
      properties:
        value:
          type: string
          minLength: 1
          description: Identifier value in the selected namespace.
        type:
          $ref: '#/components/schemas/SwitchType'
      example:
        value: '256701234567'
        type: PHONE
    SwitchType:
      title: SwitchType
      description: Type of identifier used to address a client in the Switch.
      type: string
      enum:
      - PHONE
      - MERCHANT
    UniversalPaymentLinkDto:
      type: object
      description: Universal payment link
      properties:
        id:
          type: string
          description: Payment link identifier
          example: upl-ABCDEFGH
        participantCode:
          type: string
          description: Participant code
        debtor:
          $ref: '#/components/schemas/PaymentLinkUserFull'
        creditor:
          $ref: '#/components/schemas/PaymentLinkUserFull'
        paymentData:
          $ref: '#/components/schemas/PaymentLinkPaymentDataFull'
        paymentLinkType:
          $ref: '#/components/schemas/PaymentLinkType'
        flow:
          $ref: '#/components/schemas/PaymentLinkFlowType'
        paymentLinkStatus:
          $ref: '#/components/schemas/PaymentLinkStatus'
        additionalInfo:
          type: string
          description: Additional information
        expiredTime:
          type: string
          format: date-time
          description: Expiration time
        createdBy:
          type: string
          description: Created by
        createdAt:
          type: string
          format: date-time
          description: Creation time
        version:
          type: integer
          description: Version for optimistic locking
    UniversalPaymentLinkReadDto:
      type: object
      description: Active payment link read model used to prefill a payment
      properties:
        id:
          type: string
          description: Payment link identifier
        debtor:
          $ref: '#/components/schemas/PaymentLinkUserFull'
        creditor:
          $ref: '#/components/schemas/PaymentLinkUserFull'
        paymentData:
          $ref: '#/components/schemas/PaymentLinkPaymentDataFull'
        paymentLinkType:
          $ref: '#/components/schemas/PaymentLinkType'
        flow:
          $ref: '#/components/schemas/PaymentLinkFlowType'
        additionalInfo:
          type: string
          description: Additional information
    UserFull:
      title: UserFull
      type: object
      properties:
        name:
          type: string
          minLength: 1
        account:
          type: string
          minLength: 1
        agentId:
          type: string
          minLength: 1
        tin:
          type: string
          minLength: 1
        switchId:
          $ref: '#/components/schemas/SwitchId'
      required:
      - name
      - account
      - agentId
      - tin
    UserIdentification:
      type: object
      properties:
        switchId:
          $ref: '#/components/schemas/SwitchId'
      required:
      - switchId
    UserIdentifierDto:
      type: object
      properties:
        identification:
          $ref: '#/components/schemas/UserIdentification'
      required:
      - identification
    UserUpdate:
      type: object
      description: User fields accepted by a partial payment link update
      properties:
        name:
          type: string
          description: User name
        account:
          type: string
          description: Account number
        agentId:
          type: string
          description: Agent identifier
        tin:
          type: string
          description: Tax identification number
        switchId:
          $ref: '#/components/schemas/SwitchId'
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: The request conflicts with the current resource state, including an equivalent idempotent request that
        is still being processed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    DefaultBankChangeConfirmationNotActive:
      description: The OTP confirmation is not active for the supplied operation and participant/client context, or an equivalent
        request is still being processed. For a confirmation-not-active problem, request a new verification code and use the
        new operationId; do not retry confirmation with the old operationId.
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/DefaultBankChangeConfirmationNotActiveProblem'
            - $ref: '#/components/schemas/IdempotencyRequestInProgressProblem'
    DefaultBankChangeOtpInvalid:
      description: The OTP is invalid or the idempotency key was reused for a different request. An invalid OTP does not close
        the confirmation. While the session is active, submit a corrected code with the same operationId and a new Idempotency-Key.
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/DefaultBankChangeOtpInvalidProblem'
            - $ref: '#/components/schemas/IdempotencyKeyReusedProblem'
    Forbidden:
      description: The authenticated principal is not allowed to perform this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalError:
      description: An internal server error occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    LegalEntityAccountAlreadyExists:
      description: The legal entity already has an account with the same account number or an equivalent request is still
        being processed.
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/LegalEntityAccountAlreadyExistsProblem'
            - $ref: '#/components/schemas/IdempotencyRequestInProgressProblem'
    LegalEntityConflict:
      description: A legal entity with the same TIN exists or the resource was concurrently modified.
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/LegalEntityTinAlreadyExistsProblem'
            - $ref: '#/components/schemas/ProblemDetail'
            - $ref: '#/components/schemas/IdempotencyRequestInProgressProblem'
    LegalEntityTinAlreadyExists:
      description: A legal entity with the same TIN exists or an equivalent request is still being processed.
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/LegalEntityTinAlreadyExistsProblem'
            - $ref: '#/components/schemas/IdempotencyRequestInProgressProblem'
    MerchantAlreadyExists:
      description: A merchant with the same stable identity exists or an equivalent request is still being processed.
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/MerchantAlreadyExistsProblem'
            - $ref: '#/components/schemas/IdempotencyRequestInProgressProblem'
    NotFound:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotImplemented:
      description: The operation is defined but its runtime integration is not implemented yet.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ParticipantRequestConflict:
      description: The operation message was already processed, or an equivalent request with the same idempotency key is
        still being processed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ParticipantRequestConflictProblem'
    PaymentAccepted:
      description: The payment request was accepted for asynchronous processing.
      headers:
        Location:
          description: URI of the accepted payment status resource.
          required: true
          schema:
            type: string
            format: uri-reference
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentAccepted'
    PaymentLinkAlreadyExists:
      description: A payment link with the same identity exists or an equivalent request is still being processed.
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/PaymentLinkAlreadyExistsProblem'
            - $ref: '#/components/schemas/IdempotencyRequestInProgressProblem'
    PaymentLinkConflict:
      description: The payment link conflicts with the requested operation or was concurrently modified.
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/PaymentLinkAlreadyExistsProblem'
            - $ref: '#/components/schemas/PaymentLinkTypeMismatchProblem'
            - $ref: '#/components/schemas/ProblemDetail'
            - $ref: '#/components/schemas/IdempotencyRequestInProgressProblem'
    PaymentLinkFlowNotAllowed:
      description: The selected flow is not allowed or the idempotency key was reused for a different request.
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/PaymentLinkFlowNotAllowedProblem'
            - $ref: '#/components/schemas/IdempotencyKeyReusedProblem'
    Unauthorized:
      description: Authentication is required or the access token is invalid.
      headers:
        WWW-Authenticate:
          description: Authentication challenge applicable to the requested resource.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: The request is valid but violates a business constraint, including reuse of an idempotency key with a different
        request fingerprint.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      description: Opaque account identifier in the authenticated servicing participant's namespace.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    AccountOperationDirection:
      name: direction
      in: query
      required: false
      description: Debit or credit direction relative to the account in the request path.
      schema:
        $ref: '#/components/schemas/CreditDebitIndicator'
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: Banking Marketplace application identifier assigned by Switch.
      schema:
        type: string
        format: uuid
    ApplicationStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ProductApplicationStatus'
    BankingMarketplaceConsentId:
      name: Consent-ID
      in: header
      required: true
      description: Active purpose-specific client consent authorizing the authenticated participant, requested providers and
        marketplace action. Account access consent does not satisfy this requirement.
      schema:
        type: string
        format: uuid
    CaseId:
      name: caseId
      in: path
      required: true
      description: Switch Case Management case identifier.
      schema:
        type: string
        minLength: 1
    ClientDirectoryConsentId:
      name: Consent-ID
      in: header
      required: true
      description: Active account access consent authorizing the authenticated requester for the client, account and data
        category addressed by the operation.
      schema:
        type: string
        format: uuid
    ClientSwitchId:
      name: clientSwitchId
      in: query
      required: false
      description: Client identifier value. Must be supplied together with clientSwitchType.
      schema:
        type: string
        minLength: 1
    ClientSwitchType:
      name: clientSwitchType
      in: query
      required: false
      description: Client identifier type. Must be supplied together with clientSwitchId.
      schema:
        $ref: '#/components/schemas/SwitchType'
    ConsentId:
      name: consentId
      in: path
      required: true
      description: Switch account access consent identifier.
      schema:
        type: string
        format: uuid
    ConsentRole:
      name: role
      in: query
      required: false
      description: Role of the authenticated participant in the consent.
      schema:
        $ref: '#/components/schemas/AccountAccessConsentRole'
    ConsentStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AccountAccessConsentStatus'
    DateFrom:
      name: dateFrom
      in: query
      required: false
      description: Inclusive lower bound of the operation date-time range.
      schema:
        type: string
        format: date-time
    DateTo:
      name: dateTo
      in: query
      required: false
      description: Exclusive upper bound of the operation date-time range.
      schema:
        type: string
        format: date-time
    EndRow:
      name: endRow
      in: query
      required: false
      description: Exclusive index after the last requested row. Must be greater than startRow.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID that makes this non-idempotent request safe to retry. A key is scoped to the authenticated
        participant, must not be reused for a different request payload, and may be retained by the service for a documented
        period.
      schema:
        type: string
        format: uuid
    InquiryId:
      name: inquiryId
      in: path
      required: true
      description: Banking Marketplace inquiry identifier assigned by Switch.
      schema:
        type: string
        format: uuid
    InquiryStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/MarketplaceInquiryStatus'
    LiveDataStorageAccountId:
      name: accountId
      in: path
      required: true
      description: Opaque account identifier returned by the client accounts operation.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    LiveDataStorageConsentId:
      name: Consent-ID
      in: header
      required: true
      description: Active account access consent authorizing the authenticated requester for the client, account and data
        category addressed by the operation.
      schema:
        type: string
        format: uuid
    LiveDataStorageEndRow:
      name: endRow
      in: query
      required: false
      description: Exclusive index after the last requested operation. Must be greater than startRow.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 100
    LiveDataStorageStartRow:
      name: startRow
      in: query
      required: false
      description: Zero-based index of the first requested operation.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    MaxAmount:
      name: maxAmount
      in: query
      required: false
      description: Inclusive maximum operation amount in minor currency units.
      schema:
        type: integer
        format: int64
        minimum: 1
    MinAmount:
      name: minAmount
      in: query
      required: false
      description: Inclusive minimum operation amount in minor currency units.
      schema:
        type: integer
        format: int64
        minimum: 1
    OperationId:
      name: operationId
      in: path
      required: true
      description: Switch identifier of the payment operation being reported.
      schema:
        type: string
        minLength: 1
    OperationStatus:
      name: status
      in: query
      required: false
      description: Current Switch operation status.
      schema:
        $ref: '#/components/schemas/OperationStatus'
    Signature:
      name: X-Signature
      in: header
      required: true
      description: Compact JWS signature over the exact request body bytes.
      schema:
        type: string
        minLength: 1
    StartRow:
      name: startRow
      in: query
      required: false
      description: Zero-based index of the first requested row.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    SwitchId:
      name: switchId
      in: path
      required: true
      description: Client identifier in the selected identifier namespace.
      schema:
        type: string
        minLength: 1
    SwitchType:
      name: switchType
      in: path
      required: true
      description: Type of identifier used to address the client.
      schema:
        $ref: '#/components/schemas/SwitchType'
security:
- participantMutualTLS: []
