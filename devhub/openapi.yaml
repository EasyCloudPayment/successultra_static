          type: string
          minLength: 1
          description: Participant that opened the dispute.
        respondingParticipantCode:
          type: string
          minLength: 1
          description: Counterparty participant that responds to the dispute.
        requesterReference:
          type: string
          minLength: 1
          maxLength: 35
          description: Investigation reference assigned by the requesting participant.
        responderReference:
          type: string
          minLength: 1
          maxLength: 35
          description: Investigation reference assigned by the responding participant.
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Disputed amount in minor units of the original payment currency.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 alphabetic currency code resolved from the original payment.
          example: UGX
        reason:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
          description: Switch semantic dispute reason supplied by the requesting participant.
        comment:
          type: string
          minLength: 1
          maxLength: 2048
        status:
          $ref: '#/components/schemas/PaymentDisputeCaseStatus'
        responseDecision:
          $ref: '#/components/schemas/PaymentDisputeResponseDecision'
        responseReason:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
        responseComment:
          type: string
          minLength: 1
          maxLength: 2048
        responseDueAt:
          type: string
          format: date-time
          description: Response deadline calculated by Switch from the applicable scheme rules.
        respondedAt:
          type: string
          format: date-time
        arbitrationReason:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
        arbitrationComment:
          type: string
          minLength: 1
          maxLength: 2048
        arbitrationRequestedAt:
          type: string
          format: date-time
        resolutionReason:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
          description: Switch semantic reason for the terminal arbitration outcome.
        resolutionComment:
          type: string
          minLength: 1
          maxLength: 2048
        resolvedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PaymentDisputeCaseCreateRequest:
