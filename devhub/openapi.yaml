openapi: 3.1.0
info:
  title: Switch Participant API
  version: 0.7.0
  description: Switch Participant API.
servers:
- url: https://switch.success-ultra.com
  description: Production
- url: https://d2.switchdev3.com
  description: Sandbox
tags:
- name: Participant
  description: Active participants available for a payment flow.
- name: Identity Verification
  description: Asynchronous client identity lookup.
- name: Client Lookup
  description: Client lookup by Switch identifier.
- name: Client Banks
  description: Client bank lookup and default bank management.
- name: Biometric Credentials
  description: Participant-owned FIDO credential references associated with Switch clients.
- name: Account Access Consents
  description: Client consent lifecycle for participant access to account information.
- name: Client Accounts
  description: Participant-managed and consent-gated account references of Switch clients.
- name: Account Live Data
  description: Consent-gated account balance snapshots and reported Switch operations.
- name: 'Payment: Status'
  description: Current payment status and details.
- name: 'Payment: P2P'
  description: Person-to-person payment requests.
- name: 'Payment: C2B'
  description: Customer-to-business payment requests.
- name: 'Payment: B2B'
  description: Business-to-business payment requests.
- name: 'Payment: Result'
  description: Payment results reported by creditor participants.
- name: 'Payment Link: Person Link'
  description: Person payment link creation and update.
- name: 'Payment Link: Bill Payment'
  description: Bill payment link creation and update.
- name: 'Payment Link: Request to Pay'
  description: Request-to-pay link creation and update.
- name: Payment Links
  description: Universal payment link management.
- name: 'Payment Link: Read'
  description: Active payment link data used to prefill a payment.
- name: Credit Assessment
  description: Credit assessment inquiries and provider responses.
- name: Credit Offers
  description: Personalized credit offer inquiries and provider responses.
- name: Deposit Offers
  description: Personalized deposit offer inquiries and provider responses.
- name: Credit Applications
  description: Applications for selected credit offers.
- name: Deposit Applications
  description: Applications for selected deposit offers.
- name: Merchant
  description: Merchant data management.
- name: Legal Entity
  description: Legal entity data management.
- name: Legal Entity Account
  description: Legal entity account data management.
- name: Operation Reporting
  description: Operational reporting data submitted by participants.
- name: Payment Adjustments
  description: Post-payment adjustment cases between participants.
- name: Payment Disputes
  description: Payment dispute, response and arbitration lifecycle between participants.
- name: Fraud Reports
  description: Participant fraud reports about payment operations.
- name: Legacy ISO 20022
  description: Deprecated legacy ISO 20022 integration.
x-tagGroups:
- name: Directory and identity
  tags:
  - Participant
  - Identity Verification
  - Client Lookup
  - Client Banks
  - Biometric Credentials
- name: Open banking
  tags:
  - Account Access Consents
  - Client Accounts
  - Account Live Data
- name: Payments
  tags:
  - 'Payment: Status'
  - 'Payment: P2P'
  - 'Payment: C2B'
  - 'Payment: B2B'
  - 'Payment: Result'
- name: Payment links
  tags:
  - 'Payment Link: Person Link'
  - 'Payment Link: Bill Payment'
  - 'Payment Link: Request to Pay'
  - Payment Links
  - 'Payment Link: Read'
- name: Banking marketplace
  tags:
  - Credit Assessment
  - Credit Offers
  - Deposit Offers
  - Credit Applications
  - Deposit Applications
- name: Business directory
  tags:
  - Merchant
  - Legal Entity
  - Legal Entity Account
- name: Reporting
  tags:
  - Operation Reporting
- name: Cases and risk
  tags:
  - Payment Adjustments
  - Payment Disputes
  - Fraud Reports
- name: Deprecated
  tags:
  - Legacy ISO 20022
paths:
  /participant-api/participant-ms/v1/participants:
    get:
      tags:
      - Participant
      summary: List active participants
      description: Returns a window of active participants that support the requested payment flow.
      operationId: listParticipants
      parameters:
      - name: flow
        in: query
        required: true
        description: Payment flow that returned participants must support.
        schema:
          type: string
          minLength: 1
        example: P2P
      - name: startRow
        in: query
        required: false
        description: Zero-based index of the first requested row.
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: endRow
        in: query
        required: false
        description: Exclusive index after the last requested row. Must be greater than startRow.
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 100
      responses:
        '200':
          description: Requested window of active participants supporting the payment flow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantSummaryRowsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /participant-api/identity-verification-ms/v1/identity-verifications:
    post:
      tags:
      - Identity Verification
      summary: Request identity verification
      operationId: requestIdentityVerification
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityVerificationRequest'
      responses:
        '202':
          description: Identity verification request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityVerificationAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /participant-api/identity-verification-ms/v1/identity-verifications/{verificationId}/result:
    post:
      tags:
      - Identity Verification
      summary: Report identity verification result
      operationId: reportIdentityVerificationResult
      parameters:
      - name: verificationId
        in: path
        required: true
        description: Identifier of the identity verification process.
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityVerificationResult'
      responses:
        '202':
          description: Identity verification result accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityVerificationAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /participant-api/client-directory-ms/v1/clients/{switchType}/{switchId}:
    get:
      tags:
      - Client Lookup
      summary: Find client by Switch ID
      description: Returns the minimal client data resolved by the supplied Switch identifier.
      operationId: findClientBySwitchId
      parameters:
      - $ref: '#/components/parameters/SwitchType'
      - $ref: '#/components/parameters/SwitchId'
      responses:
        '200':
          description: Client found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientLookupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /participant-api/client-directory-ms/v1/clients/{switchType}/{switchId}/banks:
    get:
      tags:
      - Client Banks
      summary: List banks associated with a client
      operationId: listClientBanks
      parameters:
      - $ref: '#/components/parameters/SwitchType'
      - $ref: '#/components/parameters/SwitchId'
      responses:
        '200':
          description: Banks associated with the client and the current default bank. Returns an empty banks array when no
            banks are known.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientBanksResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /participant-api/client-directory-ms/v1/clients/{switchType}/{switchId}/default-bank/change:
    post:
      tags:
      - Client Banks
      summary: Initiate default bank change
      description: Initiates changing the client's default bank to the calling participant and sends an OTP to the client.
        The default bank is not changed until the operation is confirmed.
      operationId: initiateDefaultBankChange
      parameters:
      - $ref: '#/components/parameters/SwitchType'
      - $ref: '#/components/parameters/SwitchId'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultBankChangeRequest'
      responses:
        '202':
          description: Default bank change was accepted and an OTP challenge was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultBankChangeAccepted'
        '204':
          description: The calling participant is already the client's default bank; no change was required.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /participant-api/client-directory-ms/v1/clients/{switchType}/{switchId}/default-bank/change/confirmation:
    post:
      tags:
      - Client Banks
      summary: Confirm default bank change
      description: Confirms the default bank change with the OTP. On successful confirmation, the calling participant becomes
        the client's default bank. An incorrect OTP returns 422 and allows another attempt while the OTP session is active;
        submit the corrected code with the same operationId and a new Idempotency-Key. If no active confirmation is available
        for the supplied operation and participant/client context, returns 409 with default-bank-change-confirmation-not-active.
        Request a new verification code and use the new operationId.
      operationId: confirmDefaultBankChange
      parameters:
      - $ref: '#/components/parameters/SwitchType'
      - $ref: '#/components/parameters/SwitchId'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultBankChangeConfirmationRequest'
      responses:
        '204':
          description: Default bank change confirmed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DefaultBankChangeConfirmationNotActive'
        '422':
          $ref: '#/components/responses/DefaultBankChangeOtpInvalid'
        '500':
          $ref: '#/components/responses/InternalError'
  /participant-api/client-directory-ms/v1/clients/{switchType}/{switchId}/biometric-credentials:
    post:
      tags:
      - Biometric Credentials
      summary: Register biometric credential reference
      description: Registers a participant-owned FIDO credential reference for the client. The participant remains the FIDO
        relying party and keeps biometric material, authenticator private keys, public keys and assertions outside Switch.
        This operation is a contract stub and returns 501 until Client Directory persistence is implemented.
      operationId: createBiometricCredential
      parameters:
      - $ref: '#/components/parameters/SwitchType'
      - $ref: '#/components/parameters/SwitchId'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BiometricCredentialCreateRequest'
      responses:
        '201':
          description: Credential reference registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiometricCredential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
    get:
      tags:
      - Biometric Credentials
      summary: List biometric credential references
      description: Lists credential lifecycle metadata visible to the authenticated participant. The response never contains
        biometric material, authenticator keys or assertions. For an existing client, returns an empty array when no credentials
        are known. This operation is a contract stub and returns 501 until Client Directory persistence is implemented.
      operationId: listBiometricCredentials
      parameters:
      - $ref: '#/components/parameters/SwitchType'
      - $ref: '#/components/parameters/SwitchId'
      responses:
        '200':
          description: Credential metadata visible to the authenticated participant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BiometricCredential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /participant-api/client-directory-ms/v1/clients/{switchType}/{switchId}/biometric-credentials/{credentialId}:
    patch:
      tags:
      - Biometric Credentials
      summary: Update biometric credential reference
      description: Updates mutable credential metadata or requests an allowed lifecycle transition. Revocation is terminal;
        credential identity and type are immutable, so key rotation creates a new credential. This operation is a contract
        stub and returns 501 until Client Directory persistence is implemented.
      operationId: updateBiometricCredential
      parameters:
      - $ref: '#/components/parameters/SwitchType'
      - $ref: '#/components/parameters/SwitchId'
      - name: credentialId
        in: path
        required: true
        description: Switch identifier of the credential registration.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BiometricCredentialUpdateRequest'
      responses:
        '200':
          description: Updated credential metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiometricCredential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /participant-api/client-consent-ms/v1/account-access-consents:
    post:
      tags:
      - Account Access Consents
      summary: Request account access consent
      description: Creates a pending account access consent request. The authenticated participant becomes the requester;
        the client identity and servicing participant are validated against their owning directories. This operation is a
        contract stub and returns 501 until Client Consent persistence and authorization workflow are implemented.
      operationId: createAccountAccessConsent
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountAccessConsentCreateRequest'
      responses:
        '201':
          description: Account access consent request created.
          headers:
            Location:
              description: URI of the created account access consent.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAccessConsent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
    get:
      tags:
      - Account Access Consents
      summary: List account access consents
      description: Lists consents in which the authenticated participant is the requester or servicing participant. Client
        and role filters never grant access to a consent unrelated to the authenticated participant. This operation is a contract
        stub and returns 501 until Client Consent persistence is implemented.
      operationId: listAccountAccessConsents
      parameters:
      - $ref: '#/components/parameters/ClientSwitchType'
      - $ref: '#/components/parameters/ClientSwitchId'
      - $ref: '#/components/parameters/ConsentRole'
      - $ref: '#/components/parameters/ConsentStatus'
      - $ref: '#/components/parameters/StartRow'
      - $ref: '#/components/parameters/EndRow'
      responses:
        '200':
          description: Account access consents visible to the authenticated participant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountAccessConsent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /participant-api/client-consent-ms/v1/account-access-consents/{consentId}:
    get:
      tags:
      - Account Access Consents
      summary: Get account access consent
      description: Returns a consent only when the authenticated participant is one of its parties. This operation is a contract
        stub and returns 501 until Client Consent persistence is implemented.
      operationId: getAccountAccessConsent
      parameters:
      - $ref: '#/components/parameters/ConsentId'
      responses:
        '200':
          description: Current account access consent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAccessConsent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /participant-api/client-consent-ms/v1/account-access-consents/{consentId}/decisions:
    post:
      tags:
      - Account Access Consents
      summary: Decide account access consent
      description: Allows only the servicing participant to authorize or reject a pending request. Authorization selects explicit
        participant-scoped accounts and activates only the permissions requested by the requester. This operation is a contract
        stub and returns 501 until the authorization workflow is implemented.
      operationId: decideAccountAccessConsent
      parameters:
      - $ref: '#/components/parameters/ConsentId'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountAccessConsentDecisionRequest'
      responses:
        '200':
          description: Account access consent decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAccessConsent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /participant-api/client-consent-ms/v1/account-access-consents/{consentId}/revocations:
    post:
      tags:
      - Account Access Consents
      summary: Revoke account access consent
      description: Revokes an active consent on instruction of an authorized party and records the semantic reason. Revocation
        is terminal and does not delete the audit record. This operation is a contract stub and returns 501 until the revocation
        workflow is implemented.
      operationId: revokeAccountAccessConsent
      parameters:
      - $ref: '#/components/parameters/ConsentId'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountAccessConsentRevocationRequest'
      responses:
        '200':
          description: Account access consent revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAccessConsent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /participant-api/client-directory-ms/v1/clients/{switchType}/{switchId}/accounts:
    get:
      tags:
      - Client Accounts
      summary: List client accounts
      description: Returns only accounts selected by the servicing participant in the active account access consent supplied
        by the requester. The consent client must match the client addressed by the path and include READ_ACCOUNTS. This operation
        is a contract stub and returns 501 until account references and consent enforcement are implemented.
      operationId: listClientAccounts
      parameters:
      - $ref: '#/components/parameters/SwitchType'
      - $ref: '#/components/parameters/SwitchId'
      - $ref: '#/components/parameters/ClientDirectoryConsentId'
      responses:
        '200':
          description: Accounts authorized by the active consent. An active consent with no visible accounts returns an empty
            array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /participant-api/client-directory-ms/v1/clients/{switchType}/{switchId}/accounts/{accountId}:
    put:
      tags:
      - Client Accounts
      summary: Register or update a client account reference
      description: Idempotently registers the authenticated participant's account reference for a known Switch client or replaces
        its participant-managed state. The authenticated participant becomes the servicing participant and must already be
        associated with the addressed client. The operation neither creates a client nor accepts a full account number. Consent-ID
        is not required because the participant manages only its own account reference. This operation is a contract stub
        and returns 501 until account-reference persistence and ownership checks are implemented.
      operationId: putClientAccountReference
      parameters:
      - $ref: '#/components/parameters/SwitchType'
      - $ref: '#/components/parameters/SwitchId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientAccountUpsertRequest'
      responses:
        '200':
          description: Existing account reference updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientAccount'
        '201':
          description: Account reference registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
