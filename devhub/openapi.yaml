components:
  securitySchemes:
    participantMutualTLS:
      type: mutualTLS
      description: Participant mutual TLS authentication.
  schemas:
    AccountAccessConsent:
      title: AccountAccessConsent
      type: object
      additionalProperties: false
      required:
      - client
      - consentId
      - createdAt
      - permissions
      - requesterParticipantCode
      - servicingParticipantCode
      - status
      - updatedAt
      - validUntil
      properties:
        consentId:
          type: string
          format: uuid
          description: Identifier assigned by Switch to the account access consent.
        client:
          $ref: '#/components/schemas/SwitchId'
        requesterParticipantCode:
          type: string
          minLength: 1
          maxLength: 64
          description: Participant requesting access to the client account information.
        servicingParticipantCode:
          type: string
          minLength: 1
          maxLength: 64
          description: Participant servicing the authorized accounts and deciding the request.
        requesterReference:
          type: string
          minLength: 1
          maxLength: 128
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AccountAccessPermission'
          contains:
            const: READ_ACCOUNTS
          minContains: 1
        authorizedAccountIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 255
        status:
          $ref: '#/components/schemas/AccountAccessConsentStatus'
        validFrom:
          type: string
          format: date-time
          description: Time from which an authorized consent may be used.
        validUntil:
          type: string
          format: date-time
        operationFromDateTime:
          type: string
          format: date-time
          description: Inclusive lower bound of operation history authorized by the client, when present.
        operationToDateTime:
          type: string
          format: date-time
          description: Inclusive upper bound of operation history authorized by the client, when present.
        statusReason:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
        statusComment:
          type: string
          minLength: 1
          maxLength: 2048
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    AccountAccessConsentCreateRequest:
      title: AccountAccessConsentCreateRequest
      type: object
      additionalProperties: false
      required:
      - client
      - permissions
      - requestTime
      - servicingParticipantCode
      - validUntil
      properties:
        client:
          $ref: '#/components/schemas/SwitchId'
        servicingParticipantCode:
          type: string
          minLength: 1
          maxLength: 64
          description: Participant that services the client accounts and decides the consent request.
        requesterReference:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional reference assigned by the requesting participant.
        requestTime:
          type: string
          format: date-time
          description: Time at which the requesting participant created the signed request.
        validUntil:
          type: string
          format: date-time
          description: Requested consent expiry. Permanent account access consents are not supported by this contract.
        operationFromDateTime:
          type: string
          format: date-time
          description: Optional inclusive lower bound of operation history authorized by the client. Applies only when READ_OPERATIONS
            is requested.
        operationToDateTime:
          type: string
          format: date-time
          description: Optional inclusive upper bound of operation history authorized by the client. Applies only when READ_OPERATIONS
            is requested and must not be later than validUntil.
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          description: Requested data clusters. READ_ACCOUNTS is mandatory; READ_BALANCES and READ_OPERATIONS may narrow the
            additional data requested for the accounts selected during authorization.
          items:
            $ref: '#/components/schemas/AccountAccessPermission'
          contains:
            const: READ_ACCOUNTS
          minContains: 1
    AccountAccessConsentDecision:
      title: AccountAccessConsentDecision
      type: string
      enum:
      - AUTHORIZE
      - REJECT
    AccountAccessConsentDecisionRequest:
      title: AccountAccessConsentDecisionRequest
      type: object
      additionalProperties: false
      required:
      - decision
      - requestTime
      properties:
        requestTime:
          type: string
          format: date-time
          description: Time at which the servicing participant created the signed decision.
        decision:
          $ref: '#/components/schemas/AccountAccessConsentDecision'
        authorizedAccountIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Participant-scoped account identifiers authorized for access. Required when decision is AUTHORIZE and
            not accepted when decision is REJECT.
          items:
            type: string
            minLength: 1
            maxLength: 255
        reason:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
          description: Semantic decision reason. Required when decision is REJECT.
        comment:
          type: string
          minLength: 1
          maxLength: 2048
    AccountAccessConsentRevocationRequest:
      title: AccountAccessConsentRevocationRequest
      type: object
      additionalProperties: false
      required:
      - reason
      - requestTime
      properties:
        requestTime:
          type: string
          format: date-time
          description: Time at which the participant created the signed revocation request.
        reason:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
          description: Semantic reason for revoking the consent.
        comment:
          type: string
          minLength: 1
          maxLength: 2048
    AccountAccessConsentRole:
      title: AccountAccessConsentRole
      type: string
      enum:
      - REQUESTER
      - SERVICING
    AccountAccessConsentStatus:
      title: AccountAccessConsentStatus
      type: string
      enum:
      - PENDING
      - ACTIVE
      - REJECTED
      - REVOKED
      - EXPIRED
    AccountAccessPermission:
      title: AccountAccessPermission
      type: string
      description: Switch account-information data clusters. The profile follows Open Banking account access consent semantics;
        READ_OPERATIONS intentionally names the Switch Operation resource rather than a complete bank ledger transaction.
      enum:
      - READ_ACCOUNTS
      - READ_BALANCES
      - READ_OPERATIONS
    AccountBalance:
      title: AccountBalance
      type: object
      description: Balance snapshot supplied by the participant that services the account.
      additionalProperties: false
      required:
      - amount
      - asOf
      - balanceType
      - creditDebitIndicator
      - currency
      properties:
        balanceType:
          $ref: '#/components/schemas/AccountBalanceType'
        amount:
          type: integer
          format: int64
          minimum: 0
          description: Absolute balance amount in minor currency units; direction is carried separately.
        creditDebitIndicator:
          $ref: '#/components/schemas/CreditDebitIndicator'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 alphabetic currency code of the balance.
          example: UGX
        asOf:
          type: string
          format: date-time
